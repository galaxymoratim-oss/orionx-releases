name: Build OrionX APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      # Restore the SAME debug keystore used for local builds so CI-built APKs
      # install over previously distributed ones. Without this, Android refuses
      # to update ("App not installed") because signatures differ.
      - name: Restore signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Keystore restored from secret."
          else
            echo "WARNING: DEBUG_KEYSTORE_BASE64 is not set - APK will be signed with a fresh key and will NOT install over existing builds!"
          fi

      - name: Resolve version
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.4.1

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare release notes
        run: |
          V="${{ steps.ver.outputs.version }}"
          NOTES="app/build/outputs/apk/debug/RELEASE_NOTES.md"
          CHANGELOG="CHANGELOG_${V//./_}_RU.md"
          {
            echo "# OrionX $V"
            echo
            if [ -f "$CHANGELOG" ]; then
              cat "$CHANGELOG"
            else
              echo "Что нового в OrionX $V."
              echo
              echo "- Исправления и улучшения стабильности"
            fi
          } > "$NOTES"
          cat "$NOTES"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: app/build/outputs/apk/debug/RELEASE_NOTES.md
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
