org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Project lives under a non-ASCII user path (C:\Users\Тимофей\...); AGP blocks this
# by default, but builds fine in practice with the check disabled.
android.overridePathCheck=true

# SHA-256 хеш пароля панели «Выпуск обновления». Генерация:
#   python -c "import hashlib;print(hashlib.sha256('ВАШ_ПАРОЛЬ'.encode()).hexdigest())"
# Раскомментируйте и подставьте свой хеш. Пароль в открытом виде нигде не хранится.
# ORIONX_ADMIN_PASSWORD_SHA256=<hex>

# Keep the Kotlin compile daemon inside a fixed budget: the project builds on an 8 GB
# machine where Gradle, the Kotlin daemon and the IDE otherwise compete for RAM.
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
